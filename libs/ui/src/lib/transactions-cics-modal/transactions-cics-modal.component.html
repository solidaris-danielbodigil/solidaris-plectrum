<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
  [appendTo]="dialogAppendTo"
  [header]="messages.header"
  [closeAriaLabel]="messages.close"
  (onHide)="onHide()"
>
  <div class="c-transactions-cics-modal__content o-flex o-flex--y o-layout--gap-3 o-layout--min-w-0">
    <p-message
      severity="warn"
      icon="bi bi-exclamation-triangle-fill"
    >{{ messages.warning }}</p-message>

    <p-iconfield class="c-transactions-cics-modal__search">
      <p-inputicon>
        <i class="bi bi-search" aria-hidden="true"></i>
      </p-inputicon>
      <input
        pInputText
        type="search"
        role="searchbox"
        autocomplete="off"
        [placeholder]="messages.searchPlaceholder"
        class="c-transactions-cics-modal__search-input o-layout--full-width"
        [ngModel]="searchQuery()"
        (ngModelChange)="onSearchChange($event)"
        [attr.aria-label]="messages.searchAriaLabel"
        data-telemetry-id="cics-modal-search"
      />
    </p-iconfield>

    <p-table
      class="c-transactions-cics-modal__table o-layout--full-width"
      [value]="filteredRows()"
      [paginator]="false"
      dataKey="code"
    >
      <ng-template #header>
        <tr>
          <th scope="col">{{ messages.columnTransaction }}</th>
          <th scope="col">{{ messages.columnDescription }}</th>
          <th scope="col">{{ messages.columnActions }}</th>
        </tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td>{{ row.code }}</td>
          <td>{{ row.description }}</td>
          <td>
            <button
              pButton
              type="button"
              severity="secondary"
              size="small"
              icon="bi bi-box-arrow-up-right"
              label="CICS"
              [attr.aria-label]="messages.launch(row.code)"
              [attr.data-telemetry-id]="'cics-launch-' + row.code"
              (click)="onLaunch(row)"
            ></button>
          </td>
        </tr>
      </ng-template>
      <ng-template #emptymessage>
        <tr>
          <td colspan="3">{{ messages.empty }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</p-dialog>
