<pds-toolbar class="o-layout o-layout--margin-block-end-2">
  <ng-container slot="start">
    <p-iconfield class="c-docs-control">
      <p-inputicon styleClass="bi bi-search" />
      <input
        pInputText
        type="search"
        role="searchbox"
        autocomplete="off"
        placeholder="Try error, validation, side panel, no results"
        aria-label="Search the catalogue by name or task"
        [value]="search()"
        (input)="onSearch($any($event.target).value)"
      />
    </p-iconfield>

    <p-select
      [options]="purposeOptions"
      [ngModel]="purpose()"
      (ngModelChange)="purpose.set($event)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      aria-label="Filter by purpose"
      [filter]="true"
      filterPlaceholder="Filter purposes"
    />

    <p-select
      [options]="implementationOptions"
      [ngModel]="implementation()"
      (ngModelChange)="implementation.set($event)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      aria-label="Filter by how it is built"
    />

    <p-select
      [options]="scopeOptions"
      [ngModel]="scope()"
      (ngModelChange)="scope.set($event)"
      optionLabel="label"
      optionValue="value"
      appendTo="body"
      aria-label="Filter by reuse scope"
    />
  </ng-container>
</pds-toolbar>

<p-table [value]="visible()" dataKey="name" size="small" sortField="name" [sortOrder]="1">
  <ng-template #header>
    <tr>
      <th scope="col"><span class="u-visually-hidden">Preview</span></th>
      <th scope="col" pSortableColumn="name">Component <p-sortIcon field="name" /></th>
      <th scope="col" pSortableColumn="purpose">Purpose <p-sortIcon field="purpose" /></th>
      <th scope="col">Built with</th>
      <th scope="col">Scope</th>
      <th scope="col">What it is for</th>
    </tr>
  </ng-template>
  <ng-template #body let-row>
    <tr>
      <td>
        @if (row.thumbnail) {
          <img class="c-docs-catalogue__thumb" [src]="row.thumbnail" alt="" />
        }
      </td>
      <td>
        @if (row.path) {
          <pds-docs-link [label]="row.name" [path]="row.path" />
        } @else {
          {{ row.name }}
        }
      </td>
      <td class="c-docs-component-index__cell">{{ row.purpose }}</td>
      <td class="c-docs-component-index__cell">{{ row.implementation }}</td>
      <td>
        <p-tag [value]="row.scope" [severity]="scopeSeverity(row)" />
      </td>
      <td class="c-docs-catalogue__summary">{{ row.summary }}</td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="6" class="c-docs-component-index__empty">
        Nothing matches. Try error, validation, side panel or no results.
      </td>
    </tr>
  </ng-template>
</p-table>
