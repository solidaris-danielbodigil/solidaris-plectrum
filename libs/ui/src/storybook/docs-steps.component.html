<p-timeline [value]="events()" align="left">
  <ng-template #marker let-event>
    <p-badge [value]="event.index" size="xlarge" />
  </ng-template>
  <ng-template #content let-event>
    <div class="c-docs-steps__head o-flex o-flex--align-items-center o-flex--wrap o-layout--gap-1">
      <strong class="c-docs-steps__title">{{ event.title }}</strong>
      @if (event.who) {
        <p-tag [value]="event.who" [severity]="event.severity" [rounded]="true" />
      }
    </div>
    @if (event.detail) {
      <p
        class="c-docs-steps__detail o-layout--margin-0 o-layout--margin-block-start-0-5"
      >
        {{ event.detail }}
      </p>
    }
    @if (event.links?.length) {
      <ul
        class="c-docs-steps__links o-flex o-flex--wrap o-flex--align-items-center o-layout--row-gap-0-5 o-layout--column-gap-1 o-layout--margin-0 o-layout--margin-block-start-0-5 o-layout--padding-0"
      >
        @for (link of event.links; track link.path) {
          <li>
            <pds-docs-link [path]="link.path" [label]="link.label" />
          </li>
        }
      </ul>
    }
  </ng-template>
</p-timeline>
