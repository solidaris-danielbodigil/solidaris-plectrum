<p-message [severity]="severity()" [icon]="icon()">
  <div class="c-docs-callout__body">
    <strong class="c-docs-callout__title">{{ title() }}</strong>
    @if (text()) {
      <p class="c-docs-callout__text o-layout--margin-0 o-layout--margin-block-start-0-5">
        {{ text() }}
      </p>
    }
    @if (items()?.length) {
      <ul
        class="c-docs-callout__list o-layout--margin-0 o-layout--margin-block-start-0-5 o-layout--padding-inline-start-2"
      >
        @for (item of items(); track item) {
          <li>{{ item }}</li>
        }
      </ul>
    }
  </div>
</p-message>
