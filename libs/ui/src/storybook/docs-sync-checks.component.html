<pds-docs-callout
  [tone]="outcome().tone"
  [title]="outcome().title"
  [text]="outcome().text"
/>

@if (report().result !== 'preview') {
  <ul class="c-docs-sync-checks__list o-layout--margin-0 o-layout--padding-0">
    @for (check of report().checks; track check.id) {
      <li class="c-docs-sync-checks__item o-flex--align-items-flex-start o-layout--gap-1 o-layout--padding-block-1">
        <p-tag
          [value]="check.status"
          [severity]="severity(check.status)"
          [rounded]="true"
        />
        <div class="c-docs-sync-checks__body">
          <strong class="c-docs-sync-checks__name">{{ check.name }}</strong>
          <p
            class="c-docs-sync-checks__detail o-layout--margin-0 o-layout--margin-block-start-0-5"
          >
            {{ check.detail }}
          </p>
          @if (check.items.length) {
            <ul
              class="c-docs-sync-checks__items o-layout--margin-0 o-layout--margin-block-start-0-5 o-layout--padding-inline-start-2"
            >
              @for (item of check.items; track $index) {
                <li>{{ item }}</li>
              }
            </ul>
          }
        </div>
      </li>
    }
  </ul>
}
