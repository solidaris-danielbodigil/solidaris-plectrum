<div class="c-docs-page-example__sheet o-flex o-flex--col o-layout o-layout--gap-4 o-layout--padding-3 o-layout--padding-4@md">
  <h1 class="c-docs-page-example__title u-text-display-md o-layout o-layout--margin-0">Mes remboursements</h1>
  <section class="c-docs-page-example__section o-flex o-flex--col o-layout o-layout--gap-2">
    <h2 class="c-docs-page-example__section-title u-text-heading-md o-layout o-layout--margin-0">Derniers remboursements</h2>
    <p-card class="c-docs-page-example__card">
      <div class="c-docs-page-example__card-body o-flex o-flex--col o-layout o-layout--gap-2">
        <h3 class="c-docs-page-example__card-title u-text-heading-sm o-layout o-layout--margin-0">Consultation du 12 septembre</h3>
        <p class="c-docs-page-example__body u-text-body-md o-layout o-layout--margin-0">
          Le remboursement est versé sur le compte enregistré.
        </p>
        <p class="o-layout o-layout--margin-0">
          <span class="u-text-label-md">Montant remboursé</span>
          <span class="u-text-body-md"> 42,50 €</span>
        </p>
        <div class="o-flex o-flex--row-wrap o-flex--align-items-center o-layout o-layout--gap-2">
          <p-button label="Télécharger" />
          <p-button label="Voir le détail" severity="secondary" [outlined]="true" />
        </div>
      </div>
    </p-card>
  </section>
</div>
