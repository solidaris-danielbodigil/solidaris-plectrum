<div
  class="c-token-explorer o-layout--padding-inline-4 o-layout--padding-block-end-6"
>
  <pds-toolbar [sticky]="true">
    <ng-container slot="start">
      <p-iconField class="c-token-explorer__search">
        <p-inputIcon styleClass="bi bi-search" />
        <input
          pInputText
          type="text"
          role="searchbox"
          autocomplete="off"
          placeholder="Search name…"
          aria-label="Search icons"
          class="c-token-explorer__search-input"
          [value]="searchQuery()"
          (input)="searchQuery.set($any($event.target).value)"
        />
        <p-inputicon>
          <pds-input-clear
            [visible]="!!searchQuery()"
            ariaLabel="Clear search"
            (clear)="clearSearchQuery()"
          />
        </p-inputicon>
      </p-iconField>

      <p-selectButton
        [options]="variantOptions"
        [ngModel]="variantFilter()"
        (ngModelChange)="variantFilter.set($event)"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        aria-label="Filter by variant"
      />

      <p-selectButton
        [options]="sizeOptions"
        [ngModel]="iconSize()"
        (ngModelChange)="iconSize.set($event)"
        optionLabel="label"
        optionValue="value"
        [allowEmpty]="false"
        aria-label="Icon preview size"
      />
    </ng-container>

    <ng-container slot="end">
      <p-badge
        severity="secondary"
        aria-live="polite"
        [value]="filteredIcons().length + ' / ' + totalCount + ' icons'"
      />
    </ng-container>
  </pds-toolbar>

  <section class="c-token-explorer__section">
    <h3 class="c-token-explorer__section-title">
      Catalog
      <span class="c-token-explorer__section-count">{{ filteredIcons().length }}</span>
    </h3>

    <ul
      class="c-token-explorer__grid o-flex o-flex--wrap o-layout--gap-2 o-layout--margin-0 o-layout--padding-0"
      role="list"
    >
      @for (name of filteredIcons(); track name) {
        <li
          class="c-token-explorer__item o-flex__item o-flex__item--12 o-flex__item--6@sm o-flex__item--4@md o-flex__item--3@lg"
          (click)="copyToClipboard(name)"
        >
          <span
            class="c-token-explorer__preview c-token-explorer__preview--icon"
            [style.--pds-token-explorer-icon-size]="previewSize()"
          >
            <i class="bi bi-{{ name }}" aria-hidden="true"></i>
          </span>

          <div class="c-token-explorer__body">
            <p class="c-token-explorer__name">{{ name }}</p>
            <p class="c-token-explorer__value">bi bi-{{ name }}</p>
          </div>

          <button
            type="button"
            class="c-token-explorer__copy"
            [attr.aria-label]="'Copy bi bi-' + name"
            (click)="copyToClipboard(name); $event.stopPropagation()"
          >
            <i class="bi bi-clipboard" aria-hidden="true"></i>
          </button>
        </li>
      }
    </ul>
  </section>

  @if (filteredIcons().length === 0) {
    <p class="c-token-explorer__empty">No icon matches “{{ searchQuery() }}”.</p>
  }
</div>
