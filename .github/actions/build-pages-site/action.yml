name: Build the Pages site
description: >-
  Builds iSHARE, iGED, the Core dashboard and Storybook for production and assembles them,
  with the verified immutable Storybook releases, into dist/pages. Needs a checkout with full
  history and an installed workspace (the setup-workspace action).

inputs:
  github-token:
    description: Token with read access to the repository's releases.
    required: true

runs:
  using: composite
  steps:
    - name: Build iSHARE for production
      shell: bash
      run: npx ng build ishare --configuration=production --base-href=/solidaris-plectrum/

    - name: Build iGED for production
      shell: bash
      run: npx ng build iged --configuration=production --base-href=/solidaris-plectrum/iged/

    - name: Build Core dashboard for production
      shell: bash
      run: npm run insights:generate && npx ng build dashboard --configuration=production --base-href=/solidaris-plectrum/dashboard/

    - name: Build Storybook
      shell: bash
      run: node tools/tokens/mark-sync-merged.mjs && npm run candidate:check && npm run build-storybook
      env:
        NODE_OPTIONS: --max-old-space-size=6144

    - name: Assemble Pages site
      shell: bash
      run: |
        mkdir -p dist/pages/storybook dist/pages/iged dist/pages/dashboard
        cp -R dist/apps/ishare/browser/. dist/pages/
        cp dist/pages/index.html dist/pages/404.html
        node tools/pages/inject-iged-404-dispatcher.mjs dist/pages/404.html
        cp -R dist/apps/iged/browser/. dist/pages/iged/
        cp -R dist/apps/dashboard/browser/. dist/pages/dashboard/
        cp -R dist/storybook/ui/. dist/pages/storybook/

    - name: Add verified immutable Storybook releases
      shell: bash
      run: node tools/pages/assemble-releases.mjs
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
