name: Set up workspace
description: Node 24 with the npm cache, a clean npm install, and optionally Playwright Chromium.

inputs:
  playwright:
    description: Also install Playwright Chromium with its system dependencies.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Install Playwright Chromium
      if: ${{ inputs.playwright == 'true' }}
      shell: bash
      run: npx playwright install --with-deps chromium
