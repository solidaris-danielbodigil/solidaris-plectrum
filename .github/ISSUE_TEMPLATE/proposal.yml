name: Component or token proposal
description: Ask the core design-system team before scaffolding or inventing. Use this if you already built something too.
title: '[Proposal]: '
labels: ['proposal']
body:
  - type: markdown
    attributes:
      value: |
        Check **Plectrum-themed PrimeNG**, then **Core** `pds-*` components, then open this issue.
        Designers may bring an already reviewed design from PLECTRUM · Custom components; application teams may bring local work. Core records the implementation decision before any new component is scaffolded or submitted.

        Storybook: [Use Plectrum in an app](https://github.com/solidaris-danielbodigil/solidaris-plectrum/blob/main/libs/ui/src/docs/get-started-consume.mdx) · [Contribute](https://github.com/solidaris-danielbodigil/solidaris-plectrum/blob/main/libs/ui/src/docs/get-started-contribute.mdx)
  - type: textarea
    id: need
    attributes:
      label: Need
      description: The screen or job the user is trying to do.
      placeholder: e.g. Filter a member list by status and date on the iSHARE search page.
    validations:
      required: true
  - type: textarea
    id: checked
    attributes:
      label: What we already checked
      description: PrimeNG (theme gallery) and Core pds-* (Find a component). Name the closest matches and why they fall short.
      placeholder: |
        PrimeNG Select — no multi-select with chips in our layout.
        pds-form-field — wraps one control, not a filter bar.
    validations:
      required: true
  - type: textarea
    id: artefact
    attributes:
      label: Figma, mock, or existing work
      description: Link a Figma node or mock. If this was already built without a proposal, attach the screen, local component, or frame.
      placeholder: https://www.figma.com/design/…
    validations:
      required: true
  - type: dropdown
    id: origin
    attributes:
      label: Where did this proposal start?
      options:
        - Design team — Custom components Figma file
        - Application team — repository or screen
        - Core team — Plectrum repository
    validations:
      required: true
  - type: textarea
    id: design-review
    attributes:
      label: Design review, if already done
      description: For a design-origin proposal, link the source node and reviewed version, name the design review decision and its evidence. Core will still review implementation feasibility.
      placeholder: Source design → reviewed design; review date and link
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: How it looks from here
      options:
        - Shared design-system component proposed by design
        - Only this application (likely app-specific)
        - A second application will need it (maybe system-level)
        - Unsure
    validations:
      required: true
  - type: dropdown
    id: already-built
    attributes:
      label: What already exists?
      options:
        - 'No — proposing before any code'
        - 'Yes — we have a local component or reviewed Figma design'
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Application
      description: For application-origin proposals only. Leave empty when the design team proposes a shared component directly.
      placeholder: ishare
    validations:
      required: false
