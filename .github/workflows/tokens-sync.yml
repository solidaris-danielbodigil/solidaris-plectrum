name: Tokens sync

on:
  push:
    branches:
      - design-tokens/sync

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm install

      - name: Copy staging tokens into the ingestion SSOT
        id: staging
        run: |
          if [ ! -f libs/plectrum/sync/tokens.json ]; then
            echo "No staging tokens.json — plugin has not pushed yet."
            echo "has_tokens=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/tokens/staging-gate.mjs --intent libs/plectrum/sync-release-intent.json libs/plectrum/sync/tokens.json
          cp libs/plectrum/sync/tokens.json libs/plectrum/src/tokens.json
          echo "has_tokens=true" >> "$GITHUB_OUTPUT"

      - name: Assemble the incoming theme before validation
        id: theme
        if: steps.staging.outputs.has_tokens == 'true'
        run: |
          if [ -z "$(find libs/plectrum/sync/theme -type f ! -name .gitkeep 2>/dev/null | head -n 1)" ]; then
            echo "incoming=false" >> "$GITHUB_OUTPUT"
            echo "No incoming theme — the previous preset stays in place."
            exit 0
          fi
          mkdir -p libs/plectrum/src/Plectrum_v1
          rsync -a --exclude .gitkeep --exclude ts/extend.ts libs/plectrum/sync/theme/ libs/plectrum/src/Plectrum_v1/
          echo "incoming=true" >> "$GITHUB_OUTPUT"
          echo "Incoming theme assembled. extend.ts was left untouched."

      - name: Build generated SCSS and the Storybook manifest
        id: build
        if: steps.staging.outputs.has_tokens == 'true'
        run: |
          npm run tokens:build
          npm run tokens:propose
          npm run tokens:build
          git diff --exit-code -- libs/styles/src/01-settings libs/ui/src/storybook/tokens.generated.ts tools/tokens/proposed.dtcg.json

      # Blocks the promotion PR. Compares the new dump with the preset and the SCSS just rebuilt.
      - name: Drift audit
        id: audit
        if: steps.staging.outputs.has_tokens == 'true'
        run: npm run tokens:audit -- --json "$RUNNER_TEMP/audit.json"

      # Runs against the assembled theme. An incoming theme that fails here blocks promotion
      # even when the previous preset was valid. The report step still runs.
      - name: Preset coverage
        id: validate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        run: npm run tokens:validate-preset -- --json "$RUNNER_TEMP/validate.json"

      # Human-readable summary: what changed, which checks passed, what happens next.
      # Lands in the job summary, becomes the promotion PR body, and — via the
      # generated TS module committed with the PR — the Storybook page
      # Docs/Token pipeline/Sync status. Changes are measured against the
      # tokens.json on main, i.e. what the apps ship, not this branch's copy.
      - name: Sync report
        if: ${{ !cancelled() && steps.staging.outputs.has_tokens == 'true' }}
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          node tools/tokens/report.mjs \
            --base git:origin/main \
            --outcome "build=${{ steps.build.outcome }}" \
            --outcome "audit=${{ steps.audit.outcome }}" \
            --outcome "validate=${{ steps.validate.outcome }}" \
            --outcome "theme=${{ steps.theme.outcome }}" \
            --audit "$RUNNER_TEMP/audit.json" \
            --validate "$RUNNER_TEMP/validate.json" \
            --md "$RUNNER_TEMP/sync-report.md" \
            --json "$RUNNER_TEMP/sync-report.json" \
            --ts libs/ui/src/storybook/sync-report.generated.ts
          cat "$RUNNER_TEMP/sync-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Reject an invalid incoming theme
        if: steps.theme.outputs.incoming == 'true' && steps.validate.outcome == 'failure'
        run: |
          echo "Incoming theme failed preset validation. The previous preset is not used as a substitute."
          exit 1

      # The promotion PR is rebuilt from main plus the assembled files. An invalid incoming theme never reaches it.
      - name: Open promotion PR
        id: pr
        if: steps.audit.outcome == 'success' && (steps.theme.outputs.incoming != 'true' || steps.validate.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snap="$RUNNER_TEMP/promote"
          rm -rf "$snap"
          mkdir -p "$snap"
          copy() { if [ -e "$1" ]; then mkdir -p "$snap/$(dirname "$1")"; cp -a "$1" "$snap/$1"; fi; }
          copy libs/plectrum/src/tokens.json
          copy libs/plectrum/sync-release-intent.json
          copy libs/ui/src/storybook/tokens.generated.ts
          copy libs/ui/src/storybook/sync-report.generated.ts
          copy tools/tokens/proposed.dtcg.json
          for file in libs/styles/src/01-settings/_settings.*.generated.scss; do copy "$file"; done
          if [ "${{ steps.theme.outputs.incoming }}" = "true" ] && [ "${{ steps.validate.outcome }}" = "success" ]; then
            while IFS= read -r -d '' file; do
              rel="libs/plectrum/src/Plectrum_v1/${file#libs/plectrum/sync/theme/}"
              copy "$rel"
            done < <(find libs/plectrum/sync/theme -type f ! -name .gitkeep ! -path '*/ts/extend.ts' -print0)
          fi
          git fetch --no-tags origin main
          git checkout -B tokens/promote-staging origin/main
          cp -a "$snap/." .
          git add -- libs/plectrum/src/tokens.json libs/plectrum/sync-release-intent.json libs/ui/src/storybook/tokens.generated.ts libs/ui/src/storybook/sync-report.generated.ts libs/styles/src/01-settings tools/tokens/proposed.dtcg.json
          if [ -d libs/plectrum/src/Plectrum_v1 ]; then git add -- libs/plectrum/src/Plectrum_v1; fi
          git commit -m 'chore(tokens): promote pinned Figma staging' \
            || echo 'Nothing generated beyond the staging commit.'
          git push --force origin tokens/promote-staging
          url="$(gh pr list --head tokens/promote-staging --base main --state open --json url --jq '.[0].url')"
          if [ -z "$url" ]; then
            url="$(gh pr create --base main --head tokens/promote-staging \
              --title 'chore(tokens): promote Figma plugin staging' \
              --body-file "$RUNNER_TEMP/sync-report.md")"
          else
            gh pr edit "$url" --body-file "$RUNNER_TEMP/sync-report.md"
          fi
          echo "pull-request-url=$url" >> "$GITHUB_OUTPUT"

      - name: Link the promotion PR in the summary
        if: steps.pr.outputs.pull-request-url != ''
        run: |
          echo "Promotion PR: ${{ steps.pr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"

      # Tell designers in Figma — promoted or blocked. Comments are annotations,
      # not design data. Skips itself when FIGMA_TOKEN is not configured and never
      # fails the promotion.
      - name: Comment in the Figma file
        if: ${{ !cancelled() && steps.staging.outputs.has_tokens == 'true' }}
        continue-on-error: true
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY }}
          FIGMA_SYNC_COMMENT_NODE_ID: ${{ vars.FIGMA_SYNC_COMMENT_NODE_ID }}
        run: |
          node tools/tokens/notify-figma.mjs \
            --report "$RUNNER_TEMP/sync-report.json" \
            --pr-url "${{ steps.pr.outputs.pull-request-url }}" \
            --post
