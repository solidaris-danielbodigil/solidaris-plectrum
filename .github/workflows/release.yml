name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm install

      # This workflow only prepares version PRs. A verified registry release,
      # manifest and versioned Storybook are still pending P7; do not turn on
      # changeset publish here independently of those outputs.
      - name: Create version PR
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
