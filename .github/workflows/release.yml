name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      # `npm ci` keeps the lockfile untouched, so the version PR carries only the version changes.
      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      # This workflow only prepares version PRs. The attended
      # publish-release.yml workflow checks private package visibility,
      # records the manifest, and publishes matching versioned Storybook.
      - name: Create version PR
        uses: changesets/action@v1
        with:
          version: npm run changeset:version
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
