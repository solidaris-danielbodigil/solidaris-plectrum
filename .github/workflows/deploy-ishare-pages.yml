name: Deploy GitHub Pages

# After every push to main, CI builds the site next to its checks and deploys it once they all
# pass (the pages-site and deploy-pages jobs in ci.yml). This workflow rebuilds and deploys the
# site on demand: when a release is published, and by hand from main.
on:
  repository_dispatch:
    types: [PLECTRUM_RELEASED]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.client_payload.revision || github.sha }}
          # Full history: the Core dashboard reads scan, catalogue and search-quality trends from git.
          fetch-depth: 0

      - name: Reject stale or mismatched source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up workspace
        uses: ./.github/actions/setup-workspace

      - name: Build the Pages site
        uses: ./.github/actions/build-pages-site
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
