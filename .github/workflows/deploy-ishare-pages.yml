name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build iSHARE for production
        run: npx ng build ishare --configuration=production --base-href=/solidaris-plectrum/

      - name: Build Storybook
        run: npx ng run ui:build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          STORYBOOK_PUBLIC_PATH: /solidaris-plectrum/storybook/

      - name: Assemble Pages site
        run: |
          mkdir -p dist/pages/storybook
          cp -R dist/apps/ishare/browser/. dist/pages/
          cp dist/pages/index.html dist/pages/404.html
          cp -R dist/storybook/ui/. dist/pages/storybook/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
