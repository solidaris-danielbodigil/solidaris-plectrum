name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  repository_dispatch:
    types: [PLECTRUM_RELEASED]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'repository_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.client_payload.revision || github.sha }}

      - name: Reject stale or mismatched source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build iSHARE for production
        run: npx ng build ishare --configuration=production --base-href=/solidaris-plectrum/

      - name: Build iGED for production
        run: npx ng build iged --configuration=production --base-href=/solidaris-plectrum/iged/

      - name: Build Storybook
        run: node tools/tokens/mark-sync-merged.mjs && npm run candidate:check && npm run build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Assemble Pages site
        run: |
          mkdir -p dist/pages/storybook dist/pages/iged
          cp -R dist/apps/ishare/browser/. dist/pages/
          cp dist/pages/index.html dist/pages/404.html
          node tools/pages/inject-iged-404-dispatcher.mjs dist/pages/404.html
          cp -R dist/apps/iged/browser/. dist/pages/iged/
          cp -R dist/storybook/ui/. dist/pages/storybook/

      - name: Add verified immutable Storybook releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/pages/assemble-releases.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
