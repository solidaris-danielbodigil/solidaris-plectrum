name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit token drift
        run: npm run tokens:audit

      - name: Validate preset token refs
        continue-on-error: true
        run: npm run tokens:validate-preset

      - name: Guard bare token declarations
        run: npm run tokens:check-prefix

      - name: Rebuild generated tokens (must be committed)
        run: npm run tokens:build && git diff --exit-code -- libs/styles/src/01-settings/*.generated.scss libs/ui/src/storybook/tokens.generated.ts

      - name: Lint token usage
        run: npm run tokens:lint

      - name: Rebuild contracts index (must be committed)
        run: npm run generate-index && git diff --exit-code -- .ai/contracts/index.json

      - name: Build applications
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Lint code
        run: npm run lint

      - name: Run Storybook
        run: npm run storybook --ci

  pack-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pack libraries and build a throwaway consumer app
        run: npm run pack:smoke

  storybook-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build Storybook
        run: npm run build-storybook

      - name: Run story smoke, interaction, a11y and coverage tests
        run: npm run test-storybook:ci

  chromatic:
    name: visual-tests
    runs-on: ubuntu-latest
    # Requires CHROMATIC_PROJECT_TOKEN (Chromatic project → Manage → Project token).
    if: ${{ vars.CHROMATIC_ENABLED == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Publish visual tests to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          zip: true

  storybook-packed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packed libraries
        run: npm run pack:libs

      - name: Build Storybook against packed tarballs
        run: npm run build-storybook:packed