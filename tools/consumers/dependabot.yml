# Template — copy into the app repo as .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      plectrum-design-system:
        patterns:
          - "@solidaris-danielbodigil/pds-ui"
          - "@solidaris-danielbodigil/pds-plectrum"
          - "@solidaris-danielbodigil/pds-styles"
          - "@solidaris-danielbodigil/pds-devkit"
