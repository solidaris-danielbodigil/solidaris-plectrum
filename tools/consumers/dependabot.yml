# Template — copy into the app repo as .github/dependabot.yml
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      plectrum-design-system:
        patterns:
          - "@solidaris-danielbodigil/ui"
          - "@solidaris-danielbodigil/plectrum"
          - "@solidaris-danielbodigil/styles"
          - "@solidaris-danielbodigil/plectrum-devkit"
